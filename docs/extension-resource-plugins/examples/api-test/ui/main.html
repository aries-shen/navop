<div id="api-test-provider" class="flex flex-col gap-2">
    <span bind="provider_name">API Test</span>
    <span bind="provider_status">ready</span>
    <input id="api-test-query" type="text" bind="query" placeholder="Search collections or environments" />
    <button
        id="api-test-refresh"
        action="refresh-resources"
        data-provider="api-test"
        data-method="api_test/collection/list"
        variant="primary"
    >
        Refresh collections
    </button>
</div>
