<div id="kubernetes-provider" class="flex flex-col gap-2">
    <span bind="provider_name">Kubernetes</span>
    <span bind="provider_status">ready</span>
    <input id="kubernetes-query" type="text" bind="query" placeholder="Filter resources or pods" />
    <button
        id="kubernetes-refresh"
        action="refresh-resources"
        data-provider="kubernetes"
        data-method="kubernetes/resource/list"
        variant="primary"
    >
        Refresh resources
    </button>
</div>
